services:
  kaair_container:
    image: kaair-moveit:${ROS_DISTRO:-jazzy}  # 빌드한 이미지 이름 (ROS_DISTRO=humble|jazzy, 기본 jazzy)
    container_name: keti_ros2_container_${ROS_DISTRO:-jazzy}
    network_mode: host           # ROS 2 통신을 위해 host 모드 권장
    ipc: host                    # FastDDS 공유 메모리 통신을 위해 필요
    privileged: true             # GPU 및 하드웨어 접근 권한
    restart: unless-stopped
    #user: root                  # host id가 아닌 sudo id 생성시 주석 제거. 기본 id 1000
    
    # Jetpack 환경의 경우 runtie 부분 주석 제거
    runtime: nvidia

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - TZ=Asia/Seoul               # 컨테이너 기본 타임존(UTC)으로 인한 로그 시간 불일치 방지
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all

      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}         # 원하는 ID로 변경 가능
      # DDS 구현체: 기본 CycloneDDS. FastRTPS로 쓰려면 RMW_IMPLEMENTATION=rmw_fastrtps_cpp 로 실행
      # 예) RMW_IMPLEMENTATION=rmw_cyclonedds_cpp docker compose -f docker-compose.jetpack.yml up -d
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - CYCLONEDDS_URI=file:///workspace/cyclonedds.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds_profile.xml
      - RMW_FASTRTPS_USE_QOS_FROM_XML=1
    
    volumes:
      # 호스트 타임존/로컬타임을 그대로 사용 (TZ 환경변수만으로는 안 맞는 도구 대비)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      # GUI 설정을 위한 X11 소켓 매핑
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # USB, 카메라 장치 매핑
      - /dev:/dev
      - /dev/shm:/dev/shm # 3. 추가: FastDDS 공유 메모리 성능 최적화
      # 프로젝트 폴더 매핑 (저장소 루트). 작업 디렉터리는 메인 워크스페이스.
      - .:/workspace

      #  Jetpack 7(Thor)의 드라이버 경로들을 더 포괄적으로 매핑
      # - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra
      # - /usr/lib/aarch64-linux-gnu/dri:/usr/lib/aarch64-linux-gnu/dri
      # - /usr/share/glvnd:/usr/share/glvnd

    # 일반 유저 실행 시 권한 문제 해결의 핵심
    group_add:
      - video
      - render
      - plugdev
      - sudo  # 필요시 추가
      - dialout  # 추가: 시리얼 포트 접근 권한


    # 5. 최신 Docker Compose 버전에서는 deploy 섹션 사용을 권장합니다.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, graphics, utility, compute]


    stdin_open: true # docker run -i
    tty: true        # docker run -t
    working_dir: /workspace
    command: >
      bash -c "/bin/bash"