###############################################
# MoveIt Servo 전용 관절 한계 override
#
# servo_node 에만 robot_description_planning 으로 넘겨서, servo 가 쓰는
# RobotModel 의 관절 위치 한계만 좁힌다. move_group(플래닝)에는 적용되지
# 않는다 (servo_module.py 참고).
#
# servo 의 관절 한계 검사는 방향성이 있다:
#   위치가 [min + joint_limit_margin, max - joint_limit_margin] 밖이고
#   그 한계 쪽으로 더 가려는 명령일 때만 HALT(JOINT_BOUND), 빠져나오는
#   방향은 허용한다. → 근접 충돌 감속(방향 무관)처럼 갇히지 않는다.
#   (kaair_servo_config.yaml 의 joint_limit_margin: 0.1)
#
# joint2: 어깨를 뒤로 젖히면 link3 가 리프트 기둥(lift_base_link)에 붙는다.
#   joint1 ≈ 0~0.5 rad 에서 측정한 link3 ↔ lift_base_link 거리:
#     j2=-0.55: 3mm, -0.50: 15mm, -0.45: 26mm, -0.40: 38mm, -0.35: 50mm
#   min_position -0.50 + margin 0.1 → j2 < -0.40 (약 38mm) 에서 정지.
#   servo 의 self_collision_proximity_threshold(20mm) 에 들어가기 전에 멈춘다.
###############################################
joint_limits:
  joint2:
    min_position: -0.50
